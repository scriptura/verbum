# trident.contract.yaml
# Contrat de localisation pour la fixture ASCII empirique du Trident.
# Aligné sur LPC-Paradigm.md.
#
# Blocs physiques confirmés :
#   grid_y 0–53       -> présent physiquement mais entièrement transparent
#   walk / Medium     -> grid_y 54–61
#   thrust / Large    -> grid_y 62–73
#
# La réalisation Large `thrust` est optionnelle dans le contrat tout en étant
# physiquement présente dans cette fixture. L'optionalité est indépendante de
# la présence physique.
#
# grid_y_starts[i] correspond à directions[i] du Profile référencé.

schema:
  paradigm: lpc
  version: 1
  fixture_role: representative_poc

contract_id: trident

# Un seul contrat doit être applicable à un asset donné.
# Zéro contrat applicable ou plusieurs contrats applicables constituent une
# erreur de build ; aucune règle implicite de priorité n'est utilisée.
applies_to:
  asset_ids:
    - trident

realizations:

  - realization_id: trident-walk
    optional: false
    grid_y_starts: [54, 56, 58, 60]

  - realization_id: trident-thrust
    optional: true
    grid_y_starts: [62, 65, 68, 71]

# Aucune réalisation Small n'est déclarée pour cet asset.
# La région physiquement présente 0–53 est transparente ; la présence d'une
# zone physique n'est donc pas confondue avec l'existence d'une
# PhysicalRealization exploitable.
