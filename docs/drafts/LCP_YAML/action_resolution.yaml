# action_resolution.yaml
# LPC AOT PoC reference fixture aligned with LPC-Paradigm-v1.3.5.
#
# Semantic resolution only:
#     ResolutionContext -> Profile
#
# No PhysicalRealization, RealizationBucket or TargetBucket is declared here.
# Bucket-sized labels such as slash_192 are forbidden here.
#
# Important model rule:
#   the YAML vocabulary is semantic/gameplay-facing;
#   the number of physical cinematiques found in a PNG does not create
#   an implicit variant mechanism.

schema:
  paradigm: lpc
  paradigm_version: "1.3.5"
  fixture_role: representative_poc

actions:

  # Main generic attack.
  # The active DriverEquipmentId may change the semantic Profile.
  - animation_action: attack
    resolution:
      default: slash
      by_equipment:
        longsword: slash
        trident: thrust

  # A distinct gameplay action may directly resolve to the same semantic
  # vocabulary as a canonical Profile. This is deliberately flat: there is
  # no generic variant mechanism.
  - animation_action: thrust
    resolution:
      default: thrust

  - animation_action: walk
    resolution:
      default: walk

  - animation_action: run
    resolution:
      default: run

  - animation_action: cast
    resolution:
      default: spellcast

  - animation_action: idle
    resolution:
      default: idle

  # `hurt` is directly exercisable in the reference fixture. Other gameplay
  # actions may still converge to the same Profile (for example die/stagger).
  - animation_action: hurt
    resolution:
      default: hurt

  - animation_action: die
    resolution:
      default: hurt

  - animation_action: stagger
    resolution:
      default: hurt

  - animation_action: sit
    resolution:
      default: sit

  - animation_action: emote
    resolution:
      default: emote

  # Closed tool compositions currently retained by the fixture.
  - animation_action: whipping
    resolution:
      default: tool_whip

  - animation_action: chopping
    resolution:
      default: tool_axe

# slash_reverse has a physical realization in the Longsword corpus, but no
# final gameplay-facing AnimationAction name is invented here merely to expose
# that asset. Its semantic entry can be added when the gameplay vocabulary is
# established.
#
# by_bucket remains supported by the paradigm but is intentionally not
# instantiated: this fixture has no genuine bucket-dependent semantic mapping.
