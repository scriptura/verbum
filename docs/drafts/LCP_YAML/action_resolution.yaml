# action_resolution.yaml
# Fixture de référence LPC pour le pipeline AOT, alignée sur LPC-Paradigm.md.
#
# Ce fichier ne porte que la résolution sémantique :
#     ResolutionContext -> Profile
#
# Aucune PhysicalRealization, aucun RealizationBucket et aucun TargetBucket
# n'est déclaré ici.
# Un identifiant comme slash_192, qui introduirait une taille physique dans
# le vocabulaire sémantique, est interdit ici.
#
# Règle de modèle importante :
#   le vocabulaire YAML reste orienté gameplay et sémantique ;
#   le nombre de cinématiques physiques présentes dans un PNG ne crée jamais
#   implicitement un mécanisme de variante.

schema:
  paradigm: lpc
  version: 1
  fixture_role: representative_poc

actions:

  # Attaque générique principale.
  # Le DriverEquipmentId actif peut modifier le Profile sémantique.
  - animation_action: attack
    resolution:
      default: slash
      by_equipment:
        longsword: slash
        trident: thrust

  - animation_action: walk
    resolution:
      default: walk

  - animation_action: run
    resolution:
      default: run

  - animation_action: cast
    resolution:
      default: spellcast

  - animation_action: idle
    resolution:
      default: idle

  # `hurt` est directement exerçable dans la fixture de référence.
  # D'autres actions de gameplay peuvent converger vers le même Profile
  # (par exemple `die` ou `stagger`).
  - animation_action: hurt
    resolution:
      default: hurt

  - animation_action: die
    resolution:
      default: hurt

  - animation_action: stagger
    resolution:
      default: hurt

  - animation_action: sit
    resolution:
      default: sit

  - animation_action: emote
    resolution:
      default: emote

  # Compositions d'outils actuellement fermées et conservées dans la fixture.
  - animation_action: whipping
    resolution:
      default: tool_whip

  - animation_action: chopping
    resolution:
      default: tool_axe

# `slash_reverse` possède une réalisation physique dans le corpus Longsword,
# mais aucun nom d'AnimationAction orienté gameplay n'est inventé ici pour
# l'exposer artificiellement.
#
# Le Profile `thrust` reste un élément sémantique canonique et peut être visé
# par une véritable AnimationAction lorsque le vocabulaire gameplay le définit.
#
# `by_bucket` reste expérimental/réservé et n'est volontairement pas instancié :
# la fixture ne possède aucune source indépendante permettant d'établir un
# TargetBucket avant la résolution concernée.
#
# `default` signifie « résolution par défaut ».
# `fallback` est réservé à une évolution future et n'a aucune sémantique
# active dans la présente version.
#
# Le Profile `tool_hammer` est désormais déclaré dans la fixture canonique et
# possède ses réalisations physiques. Son rattachement à une AnimationAction
# gameplay n'est pas inventé tant que le vocabulaire gameplay n'a pas arrêté
# cette correspondance. Une fois décidée, une action existante telle que
# `attack` pourra, par exemple, utiliser `by_equipment: {hammer: tool_hammer}`.
