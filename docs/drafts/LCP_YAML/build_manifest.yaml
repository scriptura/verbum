# build_manifest.yaml
# LPC AOT PoC reference fixture aligned with LPC-Paradigm-v1.3.5.
#
# This file remains a conceptual build-manifest / asset-registry shape, not a
# frozen tool/API schema.
#
# Responsibilities represented here:
#   - global existence/identity of PhysicalRealization;
#   - source asset and LayerId association;
#   - RealizationBucket of each realization;
#   - DriverEquipmentId -> available physical realizations;
#   - declarative physical selection by context;
#   - overlay / variant topology classification.
#
# TargetBucket is NOT declared here. It is derived AOT from the realizations
# effectively selected for the current ResolutionContext.

schema:
  paradigm: lpc
  paradigm_version: "1.3.5"
  fixture_role: representative_poc

# ================================================================
# PhysicalRealization catalogue
# ================================================================

physical_realizations:

  # ------------------------------------------------------------
  # Base Character — canonical Small realizations
  # ------------------------------------------------------------

  - realization_id: base-spellcast
    profile: spellcast
    source_asset: base_character
    layer_id: body
    realization_bucket: small

  - realization_id: base-thrust
    profile: thrust
    source_asset: base_character
    layer_id: body
    realization_bucket: small

  - realization_id: base-walk
    profile: walk
    source_asset: base_character
    layer_id: body
    realization_bucket: small

  - realization_id: base-slash
    profile: slash
    source_asset: base_character
    layer_id: body
    realization_bucket: small

  - realization_id: base-shoot
    profile: shoot
    source_asset: base_character
    layer_id: body
    realization_bucket: small

  - realization_id: base-hurt
    profile: hurt
    source_asset: base_character
    layer_id: body
    realization_bucket: small

  - realization_id: base-climb
    profile: climb
    source_asset: base_character
    layer_id: body
    realization_bucket: small

  - realization_id: base-idle
    profile: idle
    source_asset: base_character
    layer_id: body
    realization_bucket: small

  - realization_id: base-jump
    profile: jump
    source_asset: base_character
    layer_id: body
    realization_bucket: small

  - realization_id: base-sit
    profile: sit
    source_asset: base_character
    layer_id: body
    realization_bucket: small

  - realization_id: base-emote
    profile: emote
    source_asset: base_character
    layer_id: body
    realization_bucket: small

  - realization_id: base-run
    profile: run
    source_asset: base_character
    layer_id: body
    realization_bucket: small

  # ------------------------------------------------------------
  # Separate layer sources represented in this fixture
  # ------------------------------------------------------------

  - realization_id: hair-slash
    profile: slash
    source_asset: hair
    layer_id: hair
    realization_bucket: small

  - realization_id: clothes-slash
    profile: slash
    source_asset: clothes
    layer_id: clothes
    realization_bucket: small

  # ------------------------------------------------------------
  # Longsword — physical realizations confirmed by the fixture
  # ------------------------------------------------------------

  - realization_id: longsword-walk
    profile: walk
    source_asset: longsword
    layer_id: equipment
    realization_bucket: small

  - realization_id: longsword-hurt
    profile: hurt
    source_asset: longsword
    layer_id: equipment
    realization_bucket: small

  - realization_id: longsword-slash
    profile: slash
    source_asset: longsword
    layer_id: equipment
    realization_bucket: large

  - realization_id: longsword-slash-reverse
    profile: slash_reverse
    source_asset: longsword
    layer_id: equipment
    realization_bucket: large

  - realization_id: longsword-thrust
    profile: thrust
    source_asset: longsword
    layer_id: equipment
    realization_bucket: large

  # ------------------------------------------------------------
  # Trident — mixed Medium/Large physical realizations
  # ------------------------------------------------------------

  - realization_id: trident-walk
    profile: walk
    source_asset: trident
    layer_id: equipment
    realization_bucket: medium

  - realization_id: trident-thrust
    profile: thrust
    source_asset: trident
    layer_id: equipment
    realization_bucket: large

# ================================================================
# DriverEquipmentId -> available physical realizations
# ================================================================
#
# No TargetBucket is stored here. The available RealizationBucket values are
# inputs to context-specific AOT derivation after physical selection.

driver_equipment:

  none:
    role: none
    available_realizations: []

  longsword:
    role: weapon
    available_realizations:
      - longsword-walk
      - longsword-hurt
      - longsword-slash
      - longsword-slash-reverse
      - longsword-thrust

  trident:
    role: weapon
    available_realizations:
      - trident-walk
      - trident-thrust

# ================================================================
# Declarative physical selection
# ================================================================
#
# Selection key:
#     (LayerId, DriverEquipmentId, Profile) -> RealizationId
#
# 0 candidates = absence of selection.
# 1 candidate  = deterministic selection.
# >1 candidates = build ambiguity.
#
# TargetBucket is derived after the realizations for the current context are
# selected; it is never used here as a heuristic selector.

physical_selection:

  # ------------------------------------------------------------
  # No-driver contexts
  # ------------------------------------------------------------

  - layer_id: body
    driver_equipment_id: none
    profile: walk
    realization_id: base-walk

  - layer_id: body
    driver_equipment_id: none
    profile: thrust
    realization_id: base-thrust

  - layer_id: body
    driver_equipment_id: none
    profile: slash
    realization_id: base-slash

  - layer_id: body
    driver_equipment_id: none
    profile: spellcast
    realization_id: base-spellcast

  - layer_id: body
    driver_equipment_id: none
    profile: hurt
    realization_id: base-hurt

  - layer_id: body
    driver_equipment_id: none
    profile: idle
    realization_id: base-idle

  # ------------------------------------------------------------
  # Longsword contexts
  # ------------------------------------------------------------

  - layer_id: body
    driver_equipment_id: longsword
    profile: walk
    realization_id: base-walk

  - layer_id: body
    driver_equipment_id: longsword
    profile: slash
    realization_id: base-slash

  - layer_id: body
    driver_equipment_id: longsword
    profile: thrust
    realization_id: base-thrust

  - layer_id: body
    driver_equipment_id: longsword
    profile: hurt
    realization_id: base-hurt

  - layer_id: hair
    driver_equipment_id: longsword
    profile: slash
    realization_id: hair-slash

  - layer_id: clothes
    driver_equipment_id: longsword
    profile: slash
    realization_id: clothes-slash

  - layer_id: equipment
    driver_equipment_id: longsword
    profile: walk
    realization_id: longsword-walk

  - layer_id: equipment
    driver_equipment_id: longsword
    profile: slash
    realization_id: longsword-slash

  - layer_id: equipment
    driver_equipment_id: longsword
    profile: thrust
    realization_id: longsword-thrust

  - layer_id: equipment
    driver_equipment_id: longsword
    profile: hurt
    realization_id: longsword-hurt

  # ------------------------------------------------------------
  # Trident contexts
  # ------------------------------------------------------------

  - layer_id: body
    driver_equipment_id: trident
    profile: walk
    realization_id: base-walk

  - layer_id: body
    driver_equipment_id: trident
    profile: thrust
    realization_id: base-thrust

  - layer_id: equipment
    driver_equipment_id: trident
    profile: walk
    realization_id: trident-walk

  - layer_id: equipment
    driver_equipment_id: trident
    profile: thrust
    realization_id: trident-thrust

# ================================================================
# Asset topology classification
# ================================================================
#
# This classification is declarative build metadata and is never inferred
# from PNG pixels.

asset_topology:

  - asset: textures/effects/glow.png
    topology: overlay
    layer: overlays

  - asset: textures/characters/armor_alt.png
    topology: variant
    layer: torso
