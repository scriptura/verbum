# build_manifest.yaml
# Fixture de référence LPC pour le pipeline AOT, alignée sur
# LPC-Paradigm.md.
#
# Ce fichier conserve une forme conceptuelle de build manifest ; il ne fixe
# pas encore le schéma final d'un outil ou d'une API.
# Le build manifest est l'artefact déclaratif source ; l'AssetRegistry est sa
# représentation logique normalisée côté build.
#
# Responsabilités représentées ici :
#   - existence et identité globales des PhysicalRealization ;
#   - association avec l'asset source et le LayerId ;
#   - RealizationBucket de chaque réalisation ;
#   - relation DriverEquipmentId -> réalisations physiques disponibles ;
#   - sélection physique déclarative selon le contexte ;
#   - classification topologique overlay / variant.
#
# Le TargetBucket N'EST PAS déclaré ici. Il est dérivé AOT à partir des
# réalisations effectivement sélectionnées dans le ResolutionContext courant.
#
# Règles de sélection :
#   - (LayerId, DriverEquipmentId, Profile) identifie la sélection ;
#   - 0 candidat = absence de sélection ;
#   - 1 candidat = sélection déterministe ;
#   - >1 candidat = ambiguïté de build.
#
# Règle de cohérence physique : pour un même asset source, les régions
# d'extraction ne peuvent pas se chevaucher partiellement. Des régions
# exactement congruentes peuvent être réutilisées explicitement par plusieurs
# RealizationId ; les régions disjointes sont valides.

schema:
  paradigm: lpc
  version: 1
  fixture_role: representative_poc

# ================================================================
# Catalogue des PhysicalRealization
# ================================================================

physical_realizations:

  # ------------------------------------------------------------
  # LPC Character — réalisations canoniques Small
  # ------------------------------------------------------------

  - realization_id: base-spellcast
    profile: spellcast
    source_asset: base_character
    layer_id: body
    realization_bucket: small

  - realization_id: base-thrust
    profile: thrust
    source_asset: base_character
    layer_id: body
    realization_bucket: small

  - realization_id: base-walk
    profile: walk
    source_asset: base_character
    layer_id: body
    realization_bucket: small

  - realization_id: base-slash
    profile: slash
    source_asset: base_character
    layer_id: body
    realization_bucket: small

  # Réutilisation exacte de la région `slash` pour le CompositionProfile
  # `tool_hammer`. La localisation reste portée par le contrat du body.
  - realization_id: base-tool-hammer
    profile: tool_hammer
    source_asset: base_character
    layer_id: body
    realization_bucket: small

  - realization_id: base-shoot
    profile: shoot
    source_asset: base_character
    layer_id: body
    realization_bucket: small

  - realization_id: base-hurt
    profile: hurt
    source_asset: base_character
    layer_id: body
    realization_bucket: small

  - realization_id: base-climb
    profile: climb
    source_asset: base_character
    layer_id: body
    realization_bucket: small

  - realization_id: base-idle
    profile: idle
    source_asset: base_character
    layer_id: body
    realization_bucket: small

  - realization_id: base-jump
    profile: jump
    source_asset: base_character
    layer_id: body
    realization_bucket: small

  - realization_id: base-sit
    profile: sit
    source_asset: base_character
    layer_id: body
    realization_bucket: small

  - realization_id: base-emote
    profile: emote
    source_asset: base_character
    layer_id: body
    realization_bucket: small

  - realization_id: base-run
    profile: run
    source_asset: base_character
    layer_id: body
    realization_bucket: small

  # ------------------------------------------------------------
  # Sources de layers séparées représentées dans cette fixture
  # ------------------------------------------------------------

  - realization_id: hair-slash
    profile: slash
    source_asset: hair
    layer_id: hair
    realization_bucket: small

  - realization_id: clothes-slash
    profile: slash
    source_asset: clothes
    layer_id: clothes
    realization_bucket: small

  # ------------------------------------------------------------
  # Longsword — réalisations physiques confirmées par la fixture
  # ------------------------------------------------------------

  - realization_id: longsword-walk
    profile: walk
    source_asset: longsword
    layer_id: equipment
    realization_bucket: small

  - realization_id: longsword-hurt
    profile: hurt
    source_asset: longsword
    layer_id: equipment
    realization_bucket: small

  - realization_id: longsword-slash
    profile: slash
    source_asset: longsword
    layer_id: equipment
    realization_bucket: large

  - realization_id: longsword-slash-reverse
    profile: slash_reverse
    source_asset: longsword
    layer_id: equipment
    realization_bucket: large

  - realization_id: longsword-thrust
    profile: thrust
    source_asset: longsword
    layer_id: equipment
    realization_bucket: large

  # ------------------------------------------------------------
  # Trident — réalisations physiques Medium/Large
  # ------------------------------------------------------------

  - realization_id: trident-walk
    profile: walk
    source_asset: trident
    layer_id: equipment
    realization_bucket: medium

  - realization_id: trident-thrust
    profile: thrust
    source_asset: trident
    layer_id: equipment
    realization_bucket: large

  # ------------------------------------------------------------
  # Hammer — deux réalisations physiques confirmées
  # ------------------------------------------------------------

  - realization_id: hammer-walk
    profile: walk
    source_asset: hammer
    layer_id: equipment
    realization_bucket: small

  - realization_id: hammer-tool-hammer
    profile: tool_hammer
    source_asset: hammer
    layer_id: equipment
    realization_bucket: medium

  # ------------------------------------------------------------
  # Gnarled Staff — réalisations physiques confirmées
  # ------------------------------------------------------------

  - realization_id: gnarled-staff-walk
    profile: walk
    source_asset: gnarled_staff
    layer_id: equipment
    realization_bucket: small

  - realization_id: gnarled-staff-hurt
    profile: hurt
    source_asset: gnarled_staff
    layer_id: equipment
    realization_bucket: small

  - realization_id: gnarled-staff-thrust
    profile: thrust
    source_asset: gnarled_staff
    layer_id: equipment
    realization_bucket: large

# ================================================================
# DriverEquipmentId -> réalisations physiques disponibles
# ================================================================
#
# Aucun TargetBucket n'est stocké ici. Les RealizationBucket disponibles
# servent d'entrées à la dérivation AOT propre au contexte après sélection
# physique.
# `none` est la valeur de domaine explicite pour l'absence de conducteur ;
# il ne s'agit pas d'un null ni d'un sentinelle de runtime.

driver_equipment:

  none:
    role: none
    available_realizations: []

  longsword:
    role: weapon
    available_realizations:
      - longsword-walk
      - longsword-hurt
      - longsword-slash
      - longsword-slash-reverse
      - longsword-thrust

  trident:
    role: weapon
    available_realizations:
      - trident-walk
      - trident-thrust

  hammer:
    role: tool
    available_realizations:
      - hammer-walk
      - hammer-tool-hammer

  gnarled_staff:
    role: weapon
    available_realizations:
      - gnarled-staff-walk
      - gnarled-staff-hurt
      - gnarled-staff-thrust

# ================================================================
# Sélection physique déclarative
# ================================================================
#
# Clé de sélection :
#     (LayerId, DriverEquipmentId, Profile) -> RealizationId
#
# 0 candidat = absence de sélection.
# 1 candidat  = sélection déterministe.
# >1 candidats = ambiguïté de build.
#
# Le TargetBucket est dérivé après la sélection des réalisations du contexte
# courant ; il n'est jamais utilisé ici comme heuristique de sélection.

physical_selection:

  # ------------------------------------------------------------
  # Contextes sans conducteur
  # ------------------------------------------------------------

  - layer_id: body
    driver_equipment_id: none
    profile: walk
    realization_id: base-walk

  - layer_id: body
    driver_equipment_id: none
    profile: thrust
    realization_id: base-thrust

  - layer_id: body
    driver_equipment_id: none
    profile: slash
    realization_id: base-slash

  - layer_id: body
    driver_equipment_id: none
    profile: spellcast
    realization_id: base-spellcast

  - layer_id: body
    driver_equipment_id: none
    profile: hurt
    realization_id: base-hurt

  - layer_id: body
    driver_equipment_id: none
    profile: idle
    realization_id: base-idle

  # ------------------------------------------------------------
  # Contextes avec Longsword conducteur
  # ------------------------------------------------------------

  - layer_id: body
    driver_equipment_id: longsword
    profile: walk
    realization_id: base-walk

  - layer_id: body
    driver_equipment_id: longsword
    profile: slash
    realization_id: base-slash

  - layer_id: body
    driver_equipment_id: longsword
    profile: thrust
    realization_id: base-thrust

  - layer_id: body
    driver_equipment_id: longsword
    profile: hurt
    realization_id: base-hurt

  - layer_id: hair
    driver_equipment_id: longsword
    profile: slash
    realization_id: hair-slash

  - layer_id: clothes
    driver_equipment_id: longsword
    profile: slash
    realization_id: clothes-slash

  - layer_id: equipment
    driver_equipment_id: longsword
    profile: walk
    realization_id: longsword-walk

  - layer_id: equipment
    driver_equipment_id: longsword
    profile: slash
    realization_id: longsword-slash

  - layer_id: equipment
    driver_equipment_id: longsword
    profile: thrust
    realization_id: longsword-thrust

  - layer_id: equipment
    driver_equipment_id: longsword
    profile: hurt
    realization_id: longsword-hurt

  # ------------------------------------------------------------
  # Contextes avec Trident conducteur
  # ------------------------------------------------------------

  - layer_id: body
    driver_equipment_id: trident
    profile: walk
    realization_id: base-walk

  - layer_id: body
    driver_equipment_id: trident
    profile: thrust
    realization_id: base-thrust

  - layer_id: equipment
    driver_equipment_id: trident
    profile: walk
    realization_id: trident-walk

  - layer_id: equipment
    driver_equipment_id: trident
    profile: thrust
    realization_id: trident-thrust

  # ------------------------------------------------------------
  # Contextes avec Hammer conducteur
  # ------------------------------------------------------------

  - layer_id: body
    driver_equipment_id: hammer
    profile: walk
    realization_id: base-walk

  - layer_id: body
    driver_equipment_id: hammer
    profile: tool_hammer
    realization_id: base-tool-hammer

  - layer_id: equipment
    driver_equipment_id: hammer
    profile: walk
    realization_id: hammer-walk

  - layer_id: equipment
    driver_equipment_id: hammer
    profile: tool_hammer
    realization_id: hammer-tool-hammer

  # ------------------------------------------------------------
  # Contextes avec Gnarled Staff conducteur
  # ------------------------------------------------------------

  - layer_id: body
    driver_equipment_id: gnarled_staff
    profile: walk
    realization_id: base-walk

  - layer_id: body
    driver_equipment_id: gnarled_staff
    profile: thrust
    realization_id: base-thrust

  - layer_id: body
    driver_equipment_id: gnarled_staff
    profile: hurt
    realization_id: base-hurt

  - layer_id: equipment
    driver_equipment_id: gnarled_staff
    profile: walk
    realization_id: gnarled-staff-walk

  - layer_id: equipment
    driver_equipment_id: gnarled_staff
    profile: thrust
    realization_id: gnarled-staff-thrust

  - layer_id: equipment
    driver_equipment_id: gnarled_staff
    profile: hurt
    realization_id: gnarled-staff-hurt

# ================================================================
# Scénarios Gnarled Staff couverts par cette fixture
# ================================================================
#
# S7 — walk + gnarled_staff : les réalisations sélectionnées restent Small,
#      donc TargetBucket = Small.
#
# S8 — action gameplay déclarée + gnarled_staff -> thrust : le body utilise
#      sa réalisation Small de `thrust`, tandis que le bâton fournit une
#      réalisation Large dédiée sur le même Profile.
#      TargetBucket = Large.
#
# Le nom de l'AnimationAction appartient au vocabulaire gameplay et n'est
# pas inventé par le corpus physique.

# ================================================================
# Classification topologique des assets
# ================================================================
#
# Cette classification constitue des métadonnées de build déclaratives ; elle
# n'est jamais inférée à partir des pixels du PNG.

asset_topology:

  - asset: textures/effects/glow.png
    topology: overlay
    layer: overlays

  - asset: textures/characters/armor_alt.png
    topology: variant
    layer: torso

# ================================================================
# Scénarios Hammer couverts par cette fixture
# ================================================================
#
# S5a — walk + hammer : les réalisations sélectionnées restent Small, donc
#       TargetBucket = Small.
#
# S5b — cinématique `tool_hammer` : le body réutilise exactement sa région
#       physique `slash` sous l'identité `base-tool-hammer`, tandis que le
#       Hammer fournit une réalisation Medium dédiée.
#       TargetBucket = Medium.
#
# Le mapping d'une AnimationAction gameplay vers `tool_hammer` n'est pas
# inventé ici. Il pourra, lorsque le gameplay l'établira, être représenté par
# `by_equipment: {hammer: tool_hammer}` sur une action existante telle que
# `attack`.
