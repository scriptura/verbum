# longsword.contract.yaml
# Contrat de localisation pour la fixture ASCII empirique du Longsword.
# Aligné sur LPC-Paradigm.md.
#
# Blocs physiques confirmés :
#   walk / Small         -> grid_y 8–11
#   hurt / Small         -> grid_y 20
#   slash / Large        -> grid_y 54–65
#   slash_reverse / Large -> grid_y 66–77
#   thrust / Large       -> grid_y 78–89
#
# Les trois blocs Large sont contigus. Il n'existe AUCUN padding en
# grid_y 78–80.
# Une réalisation 192×192 consomme 3 grid_y par direction.
#
# grid_y_starts[i] correspond à directions[i] du Profile référencé.

schema:
  paradigm: lpc
  version: 1
  fixture_role: representative_poc

contract_id: longsword

# Un seul contrat doit être applicable à un asset donné.
# Zéro contrat applicable ou plusieurs contrats applicables constituent une
# erreur de build ; aucune règle implicite de priorité n'est utilisée.
applies_to:
  asset_ids:
    - longsword

realizations:

  - realization_id: longsword-walk
    optional: false
    grid_y_starts: [8, 9, 10, 11]

  - realization_id: longsword-hurt
    optional: false
    grid_y_starts: [20]

  - realization_id: longsword-slash
    optional: false
    grid_y_starts: [54, 57, 60, 63]

  - realization_id: longsword-slash-reverse
    optional: false
    grid_y_starts: [66, 69, 72, 75]

  - realization_id: longsword-thrust
    optional: false
    grid_y_starts: [78, 81, 84, 87]
