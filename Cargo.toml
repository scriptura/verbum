[workspace]
resolver = "3"
members = [
    "crates/engine/ecs",
    "crates/engine/schedule",
    "crates/engine/shell",
    "crates/engine/render",
    "crates/engine/assets",
    "crates/engine/forge",
    "crates/engine/verbum",

    "crates/extensions/script",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Olivier Chavarin"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/scriptura/verbum"
keywords = ["ecs", "game-engine", "dod", "aot", "deterministic"]
categories = ["game-engines", "data-structures"]

[workspace.dependencies]
verbum-assets = { path = "crates/engine/assets", version = "0.1.0" }
verbum-forge = { path = "crates/engine/forge", version = "0.1.0" }
verbum-ecs = { path = "crates/engine/ecs", version = "0.1.0" }
verbum-schedule = { path = "crates/engine/schedule", version = "0.1.0" }
verbum-render = { path = "crates/engine/render", version = "0.1.0" }
verbum-script = { path = "crates/extensions/script", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "deny"
