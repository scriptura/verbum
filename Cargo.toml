[workspace]
resolver = "3"
members = ["crates/ecs", "crates/schedule", "crates/verbum"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Olivier Chavarin"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/scriptura/verbum"
keywords = ["ecs", "game-engine", "dod", "aot", "deterministic"]
categories = ["game-engines", "data-structures"]

[workspace.dependencies]
verbum-ecs = { path = "crates/ecs", version = "0.1.0" }
verbum-schedule = { path = "crates/schedule", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "deny"
